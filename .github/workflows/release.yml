name: build-apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Buildozer (kivy/buildozer image)
        run: |
          printf 'y\n' | docker run --rm --interactive \
            --workdir /app \
            --volume "$PWD/mobile":/app \
            --volume buildozer-cache:/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-prime-apk
          path: mobile/bin/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/bin/*.apk
          generate_release_notes: true
