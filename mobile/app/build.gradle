plugins {
    id "com.android.application"
}

android {
    namespace "org.ytprime.ytprime"
    compileSdk 34

    defaultConfig {
        applicationId "org.ytprime.ytprime"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.1.3"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
